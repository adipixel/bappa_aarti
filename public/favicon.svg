<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#7d2418" />
      <stop offset="55%" stop-color="#4a140f" />
      <stop offset="100%" stop-color="#1a1110" />
    </radialGradient>
    <linearGradient id="flame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ff8a1f" />
      <stop offset="45%" stop-color="#ffc247" />
      <stop offset="100%" stop-color="#fff6d8" />
    </linearGradient>
    <linearGradient id="bowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd77a" />
      <stop offset="50%" stop-color="#e0a13a" />
      <stop offset="100%" stop-color="#a76a1c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb545" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffb545" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- halo rays -->
  <g stroke="#ffc247" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round">
    <path d="M256 84 v-34" />
    <path d="M154 118 l-19 -28" />
    <path d="M358 118 l19 -28" />
    <path d="M96 214 l-32 -11" />
    <path d="M416 214 l32 -11" />
  </g>

  <circle cx="256" cy="228" r="150" fill="url(#glow)" />

  <!-- flame -->
  <path
    d="M256 112
       c40 52 62 84 62 118
       a62 62 0 0 1 -124 0
       c0 -34 22 -66 62 -118 z"
    fill="url(#flame)" />
  <path
    d="M256 196
       c17 24 26 38 26 54
       a26 26 0 0 1 -52 0
       c0 -16 9 -30 26 -54 z"
    fill="#fffdf3" fill-opacity="0.9" />

  <!-- wick / diya bowl -->
  <path
    d="M120 316
       h272
       c-14 62 -66 96 -136 96
       s-122 -34 -136 -96 z"
    fill="url(#bowl)" />
  <ellipse cx="256" cy="316" rx="136" ry="24" fill="#ffe6ac" />
  <ellipse cx="256" cy="316" rx="136" ry="24" fill="none" stroke="#8a5314" stroke-opacity="0.35" stroke-width="4" />
  <path d="M120 316 h272" stroke="#fff3d0" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" />
</svg>
