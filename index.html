<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>Bappa Aarti — आरती संग्रह</title>
    <meta
      name="description"
      content="आरती, गजर आणि श्लोक — पूजेच्या वेळी म्हणण्यासाठी. Offline aarti sangraha for Ganpati puja."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1110" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      "black" gives an opaque black status bar with the web view laid out below
      it, which suits a dark app and — unlike "black-translucent" — gets the
      geometry right. Asked for a translucent bar, iOS placed the web view at
      the very top of the screen but sized it short by the status bar's height,
      leaving 62px along the bottom edge that belonged to nothing and could not
      be painted. Measured on an iPhone 17: screen 874, innerHeight 812,
      safe-area-inset-top 62, shell top 0.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Bappa Aarti" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Google Analytics: Replace GA_MEASUREMENT_ID with your actual ID from https://analytics.google.com -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'GA_MEASUREMENT_ID', {
        'anonymize_ip': true,
        'cookie_flags': 'SameSite=None;Secure'
      });
    </script>
    <script>
      // Apply the saved theme before first paint so the app never flashes white
      // in a dark room.
      (function () {
        try {
          var t = localStorage.getItem('ba:theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
        // Launched from the home screen: the shell pins to the viewport edges
        // instead of trusting 100dvh. Set before paint so there is no reflow.
        try {
          if (
            navigator.standalone === true ||
            window.matchMedia('(display-mode: standalone)').matches
          ) {
            document.documentElement.classList.add('is-standalone');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
